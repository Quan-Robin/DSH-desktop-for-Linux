<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Files — DeepSeek Harness</title>
<style>
  :root {
    color-scheme: light;
    /* Reasonix / Codex light sidebar palette */
    --bg: #f7f7f8;
    --bg-elev: #ffffff;
    --bg-hover: #f0f0f2;
    --bg-active: #e8edf8;
    --border: #e5e5ea;
    --border-strong: #d9d9e0;
    --text: #1c1c22;
    --text-secondary: #5c5c66;
    --text-tertiary: #9a9aa6;
    --accent: #2563eb;
    --accent-soft: rgba(37,99,235,.08);
    --green: #16a34a;
    --green-soft: rgba(22,163,74,.1);
    --amber: #d97706;
    --red: #dc2626;
    --mono: "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, ui-monospace, monospace;
    --radius: 6px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 12px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #d4d4da; border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #c2c2cb; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---- header ---- */
  header {
    display: flex; align-items: center; gap: 4px;
    padding: 8px 10px;
    background: var(--bg-elev);
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  header .brand {
    display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0;
    font-size: 11px; font-weight: 600; letter-spacing: .2px; color: var(--text-secondary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  header .brand .logo { font-size: 13px; color: var(--text-tertiary); }
  header select {
    flex: none; max-width: 118px; min-width: 0;
    font: inherit; font-size: 11px;
    color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 3px 6px; outline: none; cursor: pointer;
  }
  header select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  header .icon {
    flex: none; width: 22px; height: 22px;
    display: grid; place-items: center;
    border: none; background: transparent; color: var(--text-tertiary);
    font-size: 13px; border-radius: var(--radius); cursor: pointer; padding: 0;
  }
  header .icon:hover { color: var(--text); background: var(--bg-hover); }

  /* ---- tabs ---- */
  #tabs {
    flex: none; display: flex; gap: 0;
    padding: 0 8px; background: var(--bg-elev);
    border-bottom: 1px solid var(--border);
  }
  .tab {
    flex: 0 1 auto; padding: 7px 12px 6px;
    font-size: 11.5px; font-weight: 500; color: var(--text-tertiary);
    cursor: pointer; user-select: none;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: color .12s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .page { flex: 1; overflow: auto; display: none; flex-direction: column; min-height: 0; }
  .page.active { display: flex; }

  /* ---- overview ---- */
  #overview { padding: 10px; gap: 8px; overflow-y: auto; }
  .card {
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 8px 10px;
  }
  .card .card-title {
    font-size: 10px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase;
    color: var(--text-tertiary); margin-bottom: 6px;
  }
  .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .metric {
    border-radius: var(--radius); padding: 6px 8px; background: var(--bg);
  }
  .metric .m-label { font-size: 10px; color: var(--text-tertiary); }
  .metric .m-value { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .metric .m-value.green { color: var(--green); }
  .metric .m-value.accent { color: var(--accent); }
  .metric .m-sub { font-size: 10px; color: var(--text-tertiary); margin-top: 1px; }
  .bar { height: 6px; border-radius: 3px; background: #ececf0; overflow: hidden; margin-top: 5px; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .bar.green > i { background: var(--green); }
  .row-line { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; padding: 3px 0; }
  .row-line .k { color: var(--text-secondary); }
  .row-line .v { font-weight: 500; font-variant-numeric: tabular-nums; }
  .tokens-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .tok { background: var(--bg); border-radius: var(--radius); padding: 5px 6px; text-align: center; }
  .tok .t { font-size: 10px; color: var(--text-tertiary); }
  .tok .n { font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 1px; }

  /* ---- files ---- */
  #filterbar { flex: none; display: flex; gap: 6px; padding: 8px 10px 4px; }
  #filterbar input {
    flex: 1; font: inherit; font-size: 11.5px;
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 5px 9px; color: var(--text); background: var(--bg-elev);
    outline: none;
  }
  #filterbar input::placeholder { color: var(--text-tertiary); }
  #filterbar input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  #tree { flex: 1; overflow: auto; padding: 2px 6px 12px; }
  .node {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 6px 3px calc(6px + var(--d, 0) * 13px);
    border-radius: 4px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: none;
    color: var(--text);
  }
  .node:hover { background: var(--bg-hover); }
  .node:active { background: var(--bg-active); }
  .node .tw { width: 14px; flex: none; font-size: 11px; color: var(--text-tertiary); text-align: center; }
  .node .nm { overflow: hidden; text-overflow: ellipsis; font-size: 11.5px; }
  .node.dir { font-weight: 600; }
  .node.dir .tw { color: #ca8a04; }
  .node.file .tw { color: var(--text-tertiary); font-size: 10px; }
  .node .badge { margin-left: auto; font-size: 9px; color: var(--text-tertiary); }
  .empty { padding: 16px 12px; color: var(--text-tertiary); text-align: center; font-size: 11px; }
  .trunc { padding: 5px 10px; font-size: 10px; color: var(--text-tertiary); }

  /* ---- search results (within files tab) ---- */
  #search-results { flex: 1; overflow: auto; }
  .hit { padding: 5px 10px; cursor: pointer; border-left: 2px solid transparent; }
  .hit:hover { background: var(--bg-hover); border-left-color: var(--accent); }
  .hit .where { font-size: 10px; color: var(--text-tertiary); font-family: var(--mono); }
  .hit .what { font-family: var(--mono); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }

  /* ---- changes ---- */
  #gitbar {
    flex: none; display: flex; align-items: center; gap: 6px;
    padding: 6px 10px; font-size: 11px;
    border-bottom: 1px solid var(--border); background: var(--bg-elev);
    color: var(--text-secondary);
  }
  #gitbar .branch { font-family: var(--mono); color: var(--text); font-size: 11px; }
  #gitbar button {
    margin-left: auto; font: inherit; font-size: 10px;
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 2px 8px; background: var(--bg); color: var(--text-secondary); cursor: pointer;
  }
  #gitbar button:hover { color: var(--text); border-color: var(--accent); }
  .gfile { display: flex; gap: 7px; padding: 3px 10px; font-family: var(--mono); font-size: 11px; cursor: pointer; border-left: 2px solid transparent; }
  .gfile:hover { background: var(--bg-hover); border-left-color: var(--accent); }
  .gfile .st { width: 2ch; font-weight: 700; }
  .st.M { color: var(--amber); } .st.A { color: var(--green); } .st.D { color: var(--red); }
  #diff { margin: 0; padding: 8px 10px; overflow: auto; font: 10px/1.55 var(--mono); white-space: pre; color: var(--text-secondary); }
  #diff .add { color: var(--green); } #diff .del { color: var(--red); } #diff .hunk { color: var(--text-tertiary); }

  /* ---- preview ---- */
  #preview {
    flex: none; border-top: 1px solid var(--border);
    max-height: 38%; display: flex; flex-direction: column;
    background: var(--bg-elev);
  }
  #preview .pv-head { display: flex; align-items: center; gap: 6px; padding: 5px 10px; font-size: 11px; border-bottom: 1px solid var(--border); }
  #preview .pv-head .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; font-family: var(--mono); font-size: 10px; }
  #preview pre { margin: 0; padding: 8px 10px; overflow: auto; font: 10px/1.5 var(--mono); opacity: .85; flex: 1; color: var(--text); }
  #preview button {
    font-size: 10px; padding: 3px 9px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text-secondary); cursor: pointer;
  }
  #preview button:hover { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">◧</span><span data-i18n="brand">工作区</span></div>
  <select id="ws" title=""></select>
  <button class="icon" id="btn-refresh" title="refresh">↻</button>
  <button class="icon" id="btn-opendir" title="open in file manager">📂</button>
  <button class="icon" id="btn-close" title="close">✕</button>
</header>

<div id="tabs">
  <div class="tab active" id="tab-overview" data-i18n="tabOverview">概览</div>
  <div class="tab" id="tab-files" data-i18n="tabFiles">文件</div>
  <div class="tab" id="tab-git" data-i18n="tabGit">改动</div>
</div>

<div class="page active" id="page-overview">
  <div id="overview">
    <div class="card">
      <div class="card-title" data-i18n="sessionMetrics">会话指标</div>
      <div class="metric-grid">
        <div class="metric">
          <div class="m-label" data-i18n="sessionCost">会话费用</div>
          <div class="m-value green" id="ov-cost">—</div>
        </div>
        <div class="metric">
          <div class="m-label" data-i18n="turnCost">本轮费用</div>
          <div class="m-value green" id="ov-turn">—</div>
        </div>
      </div>
      <div class="row-line" style="margin-top:6px;"><span class="k" data-i18n="hitRate">平均命中</span><span class="v" id="ov-hit">—</span></div>
      <div class="bar green"><i id="ov-hitbar" style="width:0%"></i></div>
    </div>

    <div class="card">
      <div class="card-title" data-i18n="tokensTitle">当前 tokens</div>
      <div class="tokens-grid">
        <div class="tok"><div class="t" data-i18n="in">in</div><div class="n" id="ov-in">—</div></div>
        <div class="tok"><div class="t" data-i18n="cache">cache</div><div class="n" id="ov-cache">—</div></div>
        <div class="tok"><div class="t" data-i18n="out">out</div><div class="n" id="ov-out">—</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title" data-i18n="balanceTitle">余额</div>
      <div class="row-line"><span class="k" data-i18n="official">DeepSeek 官方</span><span class="v accent" id="ov-official">—</span></div>
      <div class="row-line"><span class="k" data-i18n="estimated">估算</span><span class="v" id="ov-estimated">—</span></div>
    </div>
  </div>
</div>

<div class="page" id="page-files">
  <div id="filterbar">
    <input id="file-q" placeholder="" spellcheck="false">
  </div>
  <div id="tree" style="overflow:auto; padding: 4px 6px 12px;"></div>
  <div id="search-results" style="display:none;"></div>
</div>

<div class="page" id="page-git">
  <div id="gitbar"><span class="branch" id="git-branch">…</span><button id="git-refresh" data-i18n="refresh">刷新</button></div>
  <div id="git-files" style="max-height:32%; overflow:auto;"></div>
  <pre id="diff"></pre>
</div>

<div id="preview" hidden>
  <div class="pv-head"><span class="t" id="pv-title"></span>
    <button id="pv-insert" data-i18n="pvInsert">引用此文件</button>
    <button id="pv-close">✕</button>
  </div>
  <pre id="pv-body"></pre>
</div>
<script>
  const DICT = {
    zh: {
      brand: '工作区', tabOverview: '概览', tabFiles: '文件', tabGit: '改动', refresh: '刷新',
      sessionMetrics: '会话指标', sessionCost: '会话费用', turnCost: '本轮费用',
      hitRate: '平均命中', tokensTitle: '当前 tokens', in: 'in', cache: 'cache', out: 'out',
      balanceTitle: '余额', official: 'DeepSeek 官方', estimated: '估算',
      filePh: '筛选文件…', noResults: '（无结果）', searching: '搜索中…', searchPh: '搜索工作区文件内容…',
      gitNone: '（非 git 工作区）', gitClean: '（无变更）',
      pickWs: '选择工作区…', noWs: '打开一个会话后，这里显示其工作区文件',
      emptyDir: '（空目录）', truncated: '条目过多，已截断',
      clickHint: '单击引用 · 双击预览', binary: '（二进制文件）', tooLarge: '（文件过大）',
      pvInsert: '引用此文件', noSession: '—', noBalance: '非官方 API 不显示余额',
    },
    en: {
      brand: 'Workspace', tabOverview: 'Overview', tabFiles: 'Files', tabGit: 'Changes', refresh: 'Refresh',
      sessionMetrics: 'Session metrics', sessionCost: 'Session cost', turnCost: 'Last turn cost',
      hitRate: 'Avg hit rate', tokensTitle: 'Current tokens', in: 'in', cache: 'cache', out: 'out',
      balanceTitle: 'Balance', official: 'DeepSeek official', estimated: 'estimated',
      filePh: 'Filter files…', noResults: '(no results)', searching: 'searching…', searchPh: 'search workspace file contents…',
      gitNone: '(not a git workspace)', gitClean: '(clean)',
      pickWs: 'Pick a workspace…', noWs: 'Open a session to browse its workspace files',
      emptyDir: '(empty)', truncated: 'too many entries — truncated',
      clickHint: 'click to reference · double-click to preview', binary: '(binary file)', tooLarge: '(file too large)',
      pvInsert: 'Reference this file', noSession: '—', noBalance: 'Balance hidden for non-official API',
    },
  };
  let lang = 'zh';
  const d = () => DICT[lang] || DICT.zh;

  const els = {
    ws: document.getElementById('ws'), tree: document.getElementById('tree'),
    preview: document.getElementById('preview'), pvTitle: document.getElementById('pv-title'), pvBody: document.getElementById('pv-body'),
    searchQ: document.getElementById('file-q'), searchResults: document.getElementById('search-results'),
    gitBranch: document.getElementById('git-branch'), gitFiles: document.getElementById('git-files'), diff: document.getElementById('diff'),
    ovCost: document.getElementById('ov-cost'), ovTurn: document.getElementById('ov-turn'), ovHit: document.getElementById('ov-hit'), ovHitbar: document.getElementById('ov-hitbar'),
    ovIn: document.getElementById('ov-in'), ovCache: document.getElementById('ov-cache'), ovOut: document.getElementById('ov-out'),
    ovOfficial: document.getElementById('ov-official'), ovEstimated: document.getElementById('ov-estimated'),
  };
  let wsState = { list: [], currentPath: '', currentSessionId: null };
  let selectedRoot = '';   // '' = follow current session cwd
  const expanded = new Set();
  let previewEntry = null;
  let searchMode = false;   // true when the file filter box shows search results instead of the tree

  function applyLang() {
    document.querySelectorAll('[data-i18n]').forEach((el) => {
      const k = el.dataset.i18n;
      if (d()[k]) el.textContent = d()[k];
      if (k === 'filePh') el.placeholder = d()[k];
      if (k === 'searchPh') el.placeholder = d()[k];
    });
  }

  function fmtTokens(t) {
    if (!t) return d().noSession;
    const k = (n) => (n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n));
    return `in ${k(t.uncachedInputTokens)} · cache ${k(t.cacheReadTokens)} · out ${k(t.outputTokens)}`;
  }

  function activeRoot() {
    if (selectedRoot) return selectedRoot;
    return wsState.currentPath || '';
  }

  function markerFor(entry) {
    // Same rule as the plugin: relative when the panel root IS the session
    // cwd, absolute otherwise (the model resolves both via its read tool).
    return activeRoot() === wsState.currentPath ? `[file: ${entry.rel}]` : `[file: ${entry.path}]`;
  }

  function renderWsOptions() {
    const sel = els.ws;
    sel.innerHTML = '';
    if (wsState.currentPath) {
      const o = document.createElement('option');
      o.value = '';
      o.textContent = '▸ ' + (wsState.currentPath.split('/').filter(Boolean).pop() || wsState.currentPath) + ' （当前会话）';
      sel.appendChild(o);
    }
    for (const w of wsState.list) {
      const o = document.createElement('option');
      o.value = w.path;
      o.textContent = w.title + ' — ' + w.path;
      if (w.path === selectedRoot) o.selected = true;
      sel.appendChild(o);
    }
  }

  async function loadDir(rel) {
    const root = activeRoot();
    if (!root) { els.tree.innerHTML = `<div class="empty">${d().noWs}</div>`; return; }
    const res = await window.desktop.wsList(root, rel);
    if (!res || !res.ok) { els.tree.innerHTML = `<div class="empty">${(res && res.error) || '—'}</div>`; return; }
    if (rel === '') {
      els.tree.textContent = '';
      for (const e of res.entries) els.tree.appendChild(nodeEl(e, 0));
      if (!res.entries.length) els.tree.innerHTML = `<div class="empty">${d().emptyDir}</div>`;
      if (res.truncated) els.tree.insertAdjacentHTML('beforeend', `<div class="trunc">${d().truncated}</div>`);
    }
    return res;
  }

  const ICONS = { js: '🟨', mjs: '🟨', ts: '🟦', json: '🟪', md: '📝', py: '🐍', sh: '🐚', html: '🌐', css: '🎨', png: '🖼️', jpg: '🖼️', gif: '🖼️', svg: '🖼️', rs: '🦀', go: '🐹', c: '🔧', h: '🔧', cpp: '🔧', yml: '⚙️', yaml: '⚙️', toml: '⚙️', lock: '🔒' };

  function nodeEl(entry, depth) {
    const div = document.createElement('div');
    const isDir = entry.type === 'directory';
    div.className = 'node ' + (isDir ? 'dir' : 'file');
    div.style.setProperty('--d', depth);
    const tw = document.createElement('span');
    tw.className = 'tw';
    tw.textContent = isDir ? (expanded.has(entry.rel) ? '▾' : '▸') : (ICONS[(entry.name.split('.').pop() || '').toLowerCase()] || '📄');
    div.appendChild(tw);
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = entry.name;
    div.appendChild(nm);
    div.title = `${entry.path}\n${d().clickHint}`;
    if (isDir) {
      div.addEventListener('click', async () => {
        const kids = div.nextElementSibling;
        if (expanded.has(entry.rel)) {
          expanded.delete(entry.rel);
          tw.textContent = '▸';
          if (kids && kids.dataset.sub === entry.rel) kids.remove();
        } else {
          expanded.add(entry.rel);
          tw.textContent = '▾';
          const sub = document.createElement('div');
          sub.dataset.sub = entry.rel;
          const res = await loadDirSub(entry.rel);
          if (res && res.ok) {
            for (const e of res.entries) sub.appendChild(nodeEl(e, depth + 1));
            if (res.truncated) sub.insertAdjacentHTML('beforeend', `<div class="trunc">${d().truncated}</div>`);
            if (!res.entries.length) sub.innerHTML = `<div class="empty">${d().emptyDir}</div>`;
          } else {
            sub.innerHTML = `<div class="empty">${(res && res.error) || '—'}</div>`;
          }
          if (kids && kids.dataset.sub === entry.rel) kids.replaceWith(sub);
          else div.after(sub);
        }
      });
    } else {
      div.addEventListener('click', () => { window.desktop.insertComposer(markerFor(entry)); });
      div.addEventListener('dblclick', () => openPreview(entry));
    }
    return div;
  }

  async function loadDirSub(rel) {
    const root = activeRoot();
    if (!root) return null;
    return window.desktop.wsList(root, rel);
  }

  async function openPreview(entry) {
    previewEntry = entry;
    els.preview.hidden = false;
    els.pvTitle.textContent = entry.name;
    els.pvBody.textContent = '…';
    const res = await window.desktop.wsPeek(entry.path);
    if (!res || !res.ok) { els.pvBody.textContent = (res && res.error) || '—'; return; }
    if (res.tooLarge) { els.pvBody.textContent = d().tooLarge; return; }
    if (res.binary) { els.pvBody.textContent = d().binary; return; }
    els.pvBody.textContent = res.content + (res.truncatedLines ? '\n…' : '');
  }

  // ---- overview strip: session costs + tokens + hit rate + balance ----
  function fmtNum(n) {
    if (n == null || Number.isNaN(n)) return '—';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k';
    return String(n);
  }
  async function refreshStats() {
    const s = await window.desktop.statsGet();
    if (!s) return;
    els.ovCost.textContent = s.sessionCost == null ? '—' : `¥${Number(s.sessionCost).toFixed(2)}`;
    els.ovTurn.textContent = s.turnCost == null ? '—' : `¥${Number(s.turnCost).toFixed(2)}`;
    const t = s.tokens || {};
    els.ovIn.textContent = fmtNum(t.uncachedInputTokens);
    els.ovCache.textContent = fmtNum(t.cacheReadTokens);
    els.ovOut.textContent = fmtNum(t.outputTokens);

    // hit rate + balance come from the full balance state
    try {
      const b = await window.desktop.getBalance();
      if (b) {
        const hr = Number(b.hitRate) * 100;
        if (!Number.isNaN(hr) && hr >= 0) {
          els.ovHit.textContent = hr.toFixed(1) + '%';
          els.ovHitbar.style.width = Math.min(100, hr).toFixed(1) + '%';
        } else {
          els.ovHit.textContent = '—';
          els.ovHitbar.style.width = '0%';
        }
        if (b.official != null) {
          els.ovOfficial.textContent = `¥${Number(b.official).toFixed(2)}${b.currency ? ' ' + b.currency : ''}`;
        } else {
          els.ovOfficial.textContent = d().noBalance;
        }
        els.ovEstimated.textContent = b.estimated != null ? `¥${Number(b.estimated).toFixed(2)}` : '—';
      }
    } catch { /* non-fatal */ }
  }

  async function refreshWsState() {
    const st = await window.desktop.wsState();
    if (st) wsState = st;
    renderWsOptions();
    expanded.clear();
    els.preview.hidden = true;
    await loadDir('');
  }

  // ---- tabs ----
  function setTab(name) {
    for (const t of ['overview', 'files', 'git']) {
      document.getElementById('tab-' + t).classList.toggle('active', t === name);
      document.getElementById('page-' + t).classList.toggle('active', t === name);
    }
    if (name === 'git') refreshGit();
    if (name === 'files') els.searchQ.focus();
  }
  document.getElementById('tab-overview').addEventListener('click', () => setTab('overview'));
  document.getElementById('tab-files').addEventListener('click', () => setTab('files'));
  document.getElementById('tab-git').addEventListener('click', () => setTab('git'));

  // ---- file filter: empty → tree, text → workspace content search ----
  let searchTimer = null;
  let searchSeq = 0;
  async function runSearch() {
    const q = els.searchQ.value.trim();
    const root = activeRoot();
    searchMode = q.length > 0;
    if (searchMode) {
      els.tree.style.display = 'none';
      els.searchResults.style.display = '';
      if (!root) { els.searchResults.innerHTML = `<div class="empty">${d().noResults}</div>`; return; }
      els.searchResults.innerHTML = `<div class="empty">${d().searching}</div>`;
      const seq = ++searchSeq;
      const r = await window.desktop.wsSearch(root, q);
      if (seq !== searchSeq) return;
      els.searchResults.textContent = '';
      if (!r || !r.ok || !r.results.length) { els.searchResults.innerHTML = `<div class="empty">${(r && r.error) || d().noResults}</div>`; return; }
      for (const hit of r.results) {
        const div = document.createElement('div');
        div.className = 'hit';
        const where = document.createElement('div');
        where.className = 'where';
        where.textContent = `${hit.rel}:${hit.line}`;
        div.appendChild(where);
        const what = document.createElement('div');
        what.className = 'what';
        what.textContent = hit.text;
        div.appendChild(what);
        div.addEventListener('click', () => openPreview({ name: hit.rel.split('/').pop(), path: hit.path, rel: hit.rel, type: 'file' }));
        els.searchResults.appendChild(div);
      }
    } else {
      els.searchResults.style.display = 'none';
      els.tree.style.display = '';
      expanded.clear();
      loadDir('');
    }
  }
  els.searchQ.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 250); });

  // ---- git review (read-only status + diff) ----
  async function refreshGit() {
    const root = activeRoot();
    els.gitBranch.textContent = '…';
    els.gitFiles.textContent = '';
    els.diff.textContent = '';
    if (!root) { els.gitBranch.textContent = d().gitNone; return; }
    const r = await window.desktop.wsGit(root);
    if (!r || !r.ok) { els.gitBranch.textContent = d().gitNone; return; }
    els.gitBranch.textContent = r.branch + (r.files.length ? ` · ${r.files.length}` : ` ${d().gitClean}`);
    for (const f of r.files) {
      const div = document.createElement('div');
      div.className = 'gfile';
      const st = document.createElement('span');
      st.className = 'st ' + (f.status ? f.status[0] : '?');
      st.textContent = f.status || '?';
      div.appendChild(st);
      const p = document.createElement('span');
      p.className = 'path';
      p.textContent = f.path;
      div.appendChild(p);
      const abs = f.path;
      div.addEventListener('click', () => openPreview({ name: abs.split('/').pop(), path: root + '/' + abs, rel: abs, type: 'file' }));
      els.gitFiles.appendChild(div);
    }
    els.diff.textContent = r.diff || '';
  }
  document.getElementById('git-refresh').addEventListener('click', refreshGit);

  els.ws.addEventListener('change', () => { selectedRoot = els.ws.value; expanded.clear(); loadDir(''); });
  document.getElementById('btn-refresh').addEventListener('click', () => { refreshWsState(); refreshStats(); });
  document.getElementById('btn-opendir').addEventListener('click', () => {
    const root = activeRoot();
    if (root) window.desktop.openExternalPath(root);
  });
  document.getElementById('btn-close').addEventListener('click', () => window.desktop.toggleFilesPanel(false));
  document.getElementById('pv-close').addEventListener('click', () => { els.preview.hidden = true; });
  document.getElementById('pv-insert').addEventListener('click', () => {
    if (previewEntry) window.desktop.insertComposer(markerFor(previewEntry));
  });

  (async () => {
    const st = await window.desktop.getState();
    lang = (st && st.language) || 'zh';
    applyLang();
    await refreshWsState();
    refreshStats();
    setInterval(refreshStats, 3000);
    setInterval(refreshWsState, 15000);
  })();
</script>
</body>
</html>
