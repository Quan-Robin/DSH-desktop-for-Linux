<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DeepSeek Harness 设置</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, "Noto Sans CJK SC", sans-serif; margin: 0; padding: 20px 24px; font-size: 13px; }
  h1 { font-size: 15px; margin: 0 0 16px; }
  .close-btn { position: fixed; top: 12px; right: 14px; border: none; background: transparent; font-size: 16px; line-height: 1; cursor: pointer; opacity: .6; padding: 4px; }
  .close-btn:hover { opacity: 1; }
  section { margin-bottom: 18px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; gap: 12px; }
  .label { color: rgba(128,128,128,1); }
  .val { font-variant-numeric: tabular-nums; }
  .muted { color: rgba(128,128,128,1); font-size: 12px; }
  button { padding: 4px 14px; border-radius: 6px; border: 1px solid rgba(128,128,128,.4); background: transparent; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: #4d6bfe; border-color: #4d6bfe; color: #fff; }
  .status-ok { color: #2e7d32; }
  .status-new { color: #c62828; }
  select { padding: 3px 8px; border-radius: 6px; }
</style>
</head>
<body>
<h1 data-i18n="settingsTitle">DeepSeek Harness 设置</h1>
<button class="close-btn" id="btn-close" title="Close" aria-label="Close">✕</button>

<section>
  <div class="row"><span class="label" data-i18n="appVersion">应用版本</span><span class="val" id="app-ver">…</span></div>
  <div class="row"><span class="label" data-i18n="curVersion">当前版本</span><span class="val" id="cur-ver">…</span></div>
  <div class="row"><span class="label" data-i18n="latestVersion">npm 最新</span><span class="val" id="latest-ver">…</span></div>
  <div class="row"><span class="label" data-i18n="updateStatus">更新状态</span><span class="val" id="update-status">…</span></div>
  <div class="row">
    <button id="btn-check" data-i18n="checkNow">检查更新</button>
    <button id="btn-update" class="primary" data-i18n="installNow" disabled>立即更新</button>
  </div>
</section>


<section>
  <div class="row"><span class="label" data-i18n="closeBehaviorLabel">关闭窗口时</span>
    <select id="sel-close">
      <option value="" data-i18n="closeUnset">首次询问（默认）</option>
      <option value="tray" data-i18n="closeTrayOpt">保留后台（托盘）</option>
      <option value="quit" data-i18n="closeQuitOpt">完全退出</option>
      <option value="ask" data-i18n="closeAskOpt">每次询问</option>
    </select>
  </div>
</section>

<section>
  <div class="row"><span class="label" data-i18n="notifyTurnEnd">对话完成提醒</span>
    <select id="sel-notify">
      <option value="true" data-i18n="notifyOn">开启（窗口不在前台时通知）</option>
      <option value="false" data-i18n="notifyOff">关闭</option>
    </select>
  </div>
</section>

<section>
  <div class="row"><span class="label" data-i18n="language">语言</span>
    <select id="sel-lang">
      <option value="zh" data-i18n="languageZh">中文</option>
      <option value="en" data-i18n="languageEn">English</option>
    </select>
  </div>
</section>

<section>
  <div class="row"><span class="label" data-i18n="quickInputLabel">全局快捷输入</span>
    <select id="sel-quick">
      <option value="true" data-i18n="quickOn">开启（Ctrl+Shift+D 唤出，需伴生插件）</option>
      <option value="false" data-i18n="quickOff">关闭</option>
    </select>
  </div>
</section>

<section>
  <div class="row"><span class="label" data-i18n="pluginMenu">伴生插件</span><span class="val" id="plugin-status">…</span></div>
  <div class="row">
    <button id="btn-plugin" data-i18n="pluginInstall">安装伴生插件（推荐）</button>
  </div>
  <div class="muted" data-i18n="pluginDesc">安装后提供：当前会话感知（不再嗅探请求）、实时轮次状态、快捷输入发送通道。安装会自动重启服务。</div>
</section>

<section>
  <div class="row"><span class="label" data-i18n="profilesMenu">配置</span>
    <select id="sel-profile"></select>
  </div>
  <div class="row">
    <button id="btn-profile-add" data-i18n="profileAdd">新增配置</button>
    <button id="btn-profile-del" data-i18n="profileDel">删除所选</button>
  </div>
  <div class="muted" data-i18n="profileDesc">每个配置独立的 dsh 数据目录（DSH_HOME）与端口——不同账号/项目互不串数据。切换会重启服务。</div>
</section>

<section>
  <div class="row"><span class="label" data-i18n="infoPort">端口</span><span class="val" id="cfg-port">…</span></div>
  <div class="row"><span class="label" data-i18n="infoSource">源码目录</span><span class="val" id="cfg-source">…</span></div>
  <div class="muted" id="tip"></div>
</section>

<script>
  const DICT = {
    zh: {
      settingsTitle: 'DeepSeek Harness 设置', appVersion: '应用版本', curVersion: '当前版本', latestVersion: 'npm 最新',
      updateStatus: '更新状态', checkNow: '检查更新', installNow: '立即更新', language: '语言',
      languageZh: '中文', languageEn: 'English', infoPort: '端口', infoSource: '源码目录',
      statusChecking: '检查中…', statusUpToDate: '已是最新', statusAvailable: '发现新版本',
      statusUnknown: '未检查', noSource: '（未设置）', checkFailed: '检查失败',
      updating: '更新中…', updated: '已更新，重启服务生效', updateFailed: '更新失败',
      closeBehaviorLabel: '关闭窗口时', closeUnset: '首次询问（默认）', closeTrayOpt: '保留后台（托盘）',
      closeQuitOpt: '完全退出', closeAskOpt: '每次询问',
      notifyTurnEnd: '对话完成提醒', notifyOn: '开启（窗口不在前台时通知）', notifyOff: '关闭',
      quickInputLabel: '全局快捷输入', quickOn: '开启（Ctrl+Shift+D 唤出，需伴生插件）', quickOff: '关闭',
      pluginMenu: '伴生插件', pluginInstall: '安装伴生插件（推荐）',
      pluginDesc: '安装后提供：当前会话感知（不再嗅探请求）、实时轮次状态、快捷输入发送通道、**完整右键菜单**（会话/工作区/正文/链接/输入框，含置顶会话扩展）。安装会自动重启服务。',
      pluginOn: '已连接', pluginOff: '未安装（功能受限）', pluginUnknown: '检测中…',
      profilesMenu: '配置', profileAdd: '新增配置', profileDel: '删除所选',
      profileDesc: '每个配置独立的 dsh 数据目录（DSH_HOME）与端口——不同账号/项目互不串数据。切换会重启服务。',
      profileNamePrompt: '配置名称（如：工作 / 个人）', profileHomePrompt: 'dsh 数据目录（空 = ~/.dsh）', profilePortPrompt: '端口（空 = 跟随当前）',
      profileDelLast: '至少保留一个配置', profileDelActive: '请先切换到其他配置再删除',
      profileExists: '同名配置已存在', profileNameRequired: '名称不能为空',
      tip: '「从源码构建并安装」见托盘/文件菜单',
    },
    en: {
      settingsTitle: 'DeepSeek Harness Settings', appVersion: 'App version', curVersion: 'Current version', latestVersion: 'Latest on npm',
      updateStatus: 'Update status', checkNow: 'Check for Updates', installNow: 'Update Now', language: 'Language',
      languageZh: '中文', languageEn: 'English', infoPort: 'Port', infoSource: 'Source dir',
      statusChecking: 'Checking…', statusUpToDate: 'Up to date', statusAvailable: 'New version available',
      statusUnknown: 'Not checked', noSource: '(not set)', checkFailed: 'Check failed',
      updating: 'Updating…', updated: 'Updated — restart service to apply', updateFailed: 'Update failed',
      closeBehaviorLabel: 'On window close', closeUnset: 'Ask on first close (default)', closeTrayOpt: 'Keep in tray',
      closeQuitOpt: 'Fully quit', closeAskOpt: 'Ask every time',
      notifyTurnEnd: 'Turn-finished notification', notifyOn: 'On (notify when window is not focused)', notifyOff: 'Off',
      quickInputLabel: 'Global quick input', quickOn: 'On (Ctrl+Shift+D, needs companion plugin)', quickOff: 'Off',
      pluginMenu: 'Companion plugin', pluginInstall: 'Install companion plugin (recommended)',
      pluginDesc: 'Provides: current-session awareness (no request sniffing), realtime turn state, the quick-input send channel, and a full in-page context menu (sessions/workspaces/editor/links/inputs, incl. the pinned-sessions extension). Installing restarts the service.',
      pluginOn: 'Connected', pluginOff: 'Not installed (limited features)', pluginUnknown: 'Checking…',
      profilesMenu: 'Profiles', profileAdd: 'Add profile', profileDel: 'Delete selected',
      profileDesc: 'Each profile has its own dsh data dir (DSH_HOME) and port — accounts/projects never mix. Switching restarts the service.',
      profileNamePrompt: 'Profile name (e.g. work / personal)', profileHomePrompt: 'dsh data dir (empty = ~/.dsh)', profilePortPrompt: 'Port (empty = keep current)',
      profileDelLast: 'Keep at least one profile', profileDelActive: 'Switch away before deleting',
      profileExists: 'A profile with this name exists', profileNameRequired: 'Name is required',
      tip: '"Build & Install" lives in the tray / File menu',
    },
  };
  let lang = 'zh';
  let state = null;

  function applyLang() {
    const d = DICT[lang] || DICT.zh;
    document.querySelectorAll('[data-i18n]').forEach((el) => {
      const k = el.dataset.i18n;
      if (d[k]) el.textContent = d[k];
    });
    document.title = d.settingsTitle;
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  }

  function render() {
    if (!state) return;
    document.getElementById('app-ver').textContent = state.appVersion ? 'v' + state.appVersion : '—';
    document.getElementById('cur-ver').textContent = state.installed || '—';
    document.getElementById('latest-ver').textContent = state.latest || '—';
    const d = DICT[lang] || DICT.zh;
    const status = document.getElementById('update-status');
    if (state.checkedAt === 0) status.textContent = d.statusUnknown;
    else if (state.update) { status.textContent = d.statusAvailable + ` (${state.latest})`; status.className = 'val status-new'; }
    else if (state.installed) { status.textContent = d.statusUpToDate; status.className = 'val status-ok'; }
    else status.textContent = d.statusUnknown;
    document.getElementById('btn-update').disabled = !(state.update && state.checkedAt > 0);
    document.getElementById('cfg-port').textContent = state.port;
    document.getElementById('cfg-source').textContent = state.sourceDir || d.noSource;
    document.getElementById('tip').textContent = d.tip;
    document.getElementById('sel-lang').value = lang;
    document.getElementById('sel-close').value = state.closeBehavior || '';
    document.getElementById('sel-notify').value = String(state.notifyOnTurnEnd !== false);
    document.getElementById('sel-quick').value = String(state.quickInputEnabled !== false);
    const ps = document.getElementById('plugin-status');
    if (state.pluginAvailable) { ps.textContent = d.pluginOn; ps.className = 'val status-ok'; }
    else { ps.textContent = d.pluginOff; ps.className = 'val status-new'; }
    document.getElementById('btn-plugin').disabled = !!state.pluginAvailable;
    const sel = document.getElementById('sel-profile');
    sel.innerHTML = '';
    for (const p of state.profiles || []) {
      const o = document.createElement('option');
      o.value = p.name;
      o.textContent = p.name + (p.dshHome ? ` (${p.dshHome})` : '') + (p.port ? ` :${p.port}` : '');
      if (p.name === state.activeProfile) o.selected = true;
      sel.appendChild(o);
    }
  }

  window.desktop.onLanguageChanged((l) => { lang = l; applyLang(); render(); });
  document.getElementById('btn-close').addEventListener('click', () => window.desktop.closeSettings());
  document.getElementById('sel-close').addEventListener('change', (e) => {
    window.desktop.setCloseBehavior(e.target.value);
  });
  document.getElementById('sel-notify').addEventListener('change', (e) => {
    window.desktop.setNotify(e.target.value === 'true');
  });
  document.getElementById('sel-quick').addEventListener('change', (e) => {
    window.desktop.setQuickInput(e.target.value === 'true');
  });
  document.getElementById('btn-plugin').addEventListener('click', async () => {
    await window.desktop.installPlugin();
    // the service is restarting; close the overlay, status will refresh on reopen
    window.desktop.closeSettings();
  });
  document.getElementById('sel-profile').addEventListener('change', async (e) => {
    await window.desktop.switchProfile(e.target.value);
    state = await window.desktop.getState();
    render();
  });
  document.getElementById('btn-profile-add').addEventListener('click', async () => {
    const d = DICT[lang] || DICT.zh;
    const name = prompt(d.profileNamePrompt, '');
    if (name === null) return;
    if (!name.trim()) { alert(d.profileNameRequired); return; }
    const home = prompt(d.profileHomePrompt, '') || '';
    const portStr = prompt(d.profilePortPrompt, '') || '';
    const port = /^\d+$/.test(portStr.trim()) ? Number(portStr.trim()) : null;
    const r = await window.desktop.addProfile({ name: name.trim(), dshHome: home.trim(), port });
    if (!r.ok) { alert(r.error === 'name exists' ? d.profileExists : r.error); return; }
    state = await window.desktop.getState();
    render();
  });
  document.getElementById('btn-profile-del').addEventListener('click', async () => {
    const d = DICT[lang] || DICT.zh;
    const sel = document.getElementById('sel-profile');
    if (!sel.value) return;
    const r = await window.desktop.removeProfile(sel.value);
    if (!r.ok) { alert(r.error === 'cannot remove the last profile' ? d.profileDelLast : r.error === 'switch away first' ? d.profileDelActive : r.error); return; }
    state = await window.desktop.getState();
    render();
  });
  document.getElementById('sel-lang').addEventListener('change', (e) => {
    window.desktop.setLanguage(e.target.value);
  });
  document.getElementById('btn-check').addEventListener('click', async () => {
    const d = DICT[lang] || DICT.zh;
    document.getElementById('update-status').textContent = d.statusChecking;
    state = await window.desktop.checkUpdate();
    render();
  });
  document.getElementById('btn-update').addEventListener('click', async () => {
    const d = DICT[lang] || DICT.zh;
    const btn = document.getElementById('btn-update');
    btn.disabled = true;
    btn.textContent = d.updating;
    await window.desktop.updateDsh();
    state = await window.desktop.getState();
    render();
    btn.textContent = d.installNow;
  });

  (async () => {
    state = await window.desktop.getState();
    lang = state.language || 'zh';
    applyLang();
    render();
  })();
</script>
</body>
</html>
